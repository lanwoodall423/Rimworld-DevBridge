name: Portable checks

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable checks
        shell: pwsh
        run: ./DevTools/Test-Portable.ps1
      - name: Validate Bash verifier syntax
        shell: bash
        run: bash -n DevTools/Test-RimWorldDevBridgePackage.sh
